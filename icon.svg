<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Para-choque -->
  <rect x="5" y="78" width="90" height="8" rx="3" fill="#0f172a"/>

  <!-- Cabine principal (corpo do caminhão, lado frontal 3/4 representa o FH) -->
  <path d="M14 78 L14 40 Q14 22 34 22 L66 22 Q82 22 82 40 L82 78 Z" fill="url(#cab)" stroke="#64748b" stroke-width="1"/>

  <!-- Teto -->
  <rect x="12" y="15" width="40" height="9" rx="4" fill="#cbd5e1"/>

  <!-- Grade frontal degradê do Volvo FH -->
  <path d="M22 48 L74 48 L74 78 L22 78 Z" fill="#2563eb"/>

  <!-- Linha diagonal da grade (estilo Volvo FH) -->
  <path d="M26 78 L50 48 M38 78 L62 48 M50 78 L74 48 M22 66 L42 48 M62 78 L74 66" stroke="#60a5fa" stroke-width="1" stroke-linecap="round"/>

  <!-- Para-brisa levemente inclinado -->
  <path d="M20 30 Q20 24 34 24 L58 24 L58 40 L20 40 Z" fill="url(#window)"/>
  <line x1="20" y1="32" x2="58" y2="32" stroke="#7dd3fc" stroke-width="1"/>

  <!-- Espelho retrovisor -->
  <rect x="10" y="24" width="4" height="6" rx="1.5" fill="#0f172a"/>
  <rect x="80" y="24" width="4" height="6" rx="1.5" fill="#0f172a"/>

  <!-- Farol alto / linha de luz -->
  <rect x="22" y="44" width="24" height="4" rx="2" fill="#fbbf24"/>
  <rect x="48" y="44" width="24" height="4" rx="2" fill="#fbbf24"/>

  <!-- Defletor de ar -->
  <path d="M14 40 L14 34 Q14 28 22 27 L22 40 Z" fill="#64748b"/>

  <!-- Escapamento / farol baixo -->
  <rect x="16" y="72" width="6" height="4" rx="1" fill="#475569"/>

  <!-- Rodas da frente (duplas) -->
  <circle cx="40" cy="80" r="9" fill="#0f172a"/>
  <circle cx="40" cy="80" r="4.5" fill="#94a3b8"/>
  <circle cx="62" cy="80" r="9" fill="#0f172a"/>
  <circle cx="62" cy="80" r="4.5" fill="#94a3b8"/>

  <!-- Volvo pelaicerlogo simbolo (linha retangular) -->
  <rect x="30" y="14" width="13" height="4" rx="2" fill="#f8fafc"/>
</svg>